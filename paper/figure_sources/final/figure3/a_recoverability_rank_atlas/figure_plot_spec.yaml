figure_type: rank_spectrum_with_microscopy
inferential_units:
  - reporter
  - physical_screen
  - reporter_screen_assay
splits: [Field, Gene, Whole-screen]
score: KO-level Pearson r
consensus: unweighted median across ten frozen models
