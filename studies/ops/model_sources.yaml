schema_version: 1
purpose: >-
  Machine-readable provenance boundary for the OPS frozen model roster. This
  file records identities and checksums; it does not bundle checkpoints,
  third-party source, or historical result files.

study_owned_sources:
  - logical_name: candidate_model_architectures
    historical_filename: ops_reporter_candidate_models.py
    sha256: eeb80b7838ade5ab111b0aa41827b8b72d270910519e67d1992d5c7bdbdeda3d
    covers: [MLP, ResMLP, MultiTab, TabM wrapper]
    public_status: OPS-native architecture and training API available
    numerical_parity_requirement: >-
      Frozen preprocessing, split manifests, optimization configuration,
      validation selection, AMP and checkpoint state must also match before
      claiming identical numerical outputs.
  - logical_name: masked_multitask_training
    historical_filename: ops_reporter_masked_multitask_v2_lib.py
    sha256: edde55c07d4266aaa6ced494fddabda3cce2206d3dcf1013485979b61f87b0e1
    covers: [ResMLP, reporter-balanced sampling, observed-only loss]
    public_status: OPS-native architecture and training API available
    numerical_parity_requirement: >-
      Exact interrupted-run trajectory additionally requires the same AMP,
      RNG, optimizer and checkpoint state.

